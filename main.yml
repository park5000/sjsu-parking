name: scrape parking

on:
  schedule:
    # Hourly, with each shift ending BEFORE the next trigger arrives.
    # GitHub skips a scheduled trigger if a run of the same workflow is still
    # in progress, so a shift longer than its own interval starves the next
    # one. 55 < 60 leaves the door open. Hourly also means a dropped trigger
    # costs one hour, not two.
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false  # shifts no longer overlap, so nothing to cancel

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 65       # hard ceiling; the script exits before this
    env:
      TZ: America/Los_Angeles
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure git
        run: |
          git config user.name "parking-bot"
          git config user.email "parking-bot@users.noreply.github.com"

      - name: Sample for one shift
        run: python parking.py collect --adaptive --duration 55 --push
